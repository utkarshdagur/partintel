services:
  - type: web
    name: partintel-ingest
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_ingest.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8765
      # Add your LLM keys in the Render Dashboard securely:
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: OPENAI_API_KEY
      #   sync: false
